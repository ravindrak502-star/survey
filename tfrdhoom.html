.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:22px}.kpi span{font-size:11px;color:var(--mut)}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}.item b{font-size:15px}.item small{color:var(--mut);display:block;margin-top:3px}
.badge{font-size:11px;background:#eaf0ff;color:#1264ff;padding:3px 8px;border-radius:99px;margin-left:6px}
.auto{background:var(--st);border-radius:9px;padding:10px;font-size:13px;margin-top:8px}
.missing{outline:2px solid #e5484d;background:#fff0f0!important;color:#000}
select[data-k="status"]{position:relative}
select[data-k="status"]{position:relative}
.statusPick{position:relative}
.statusPickRow{display:flex;gap:6px;align-items:stretch}
.statusPickRow input{flex:1;min-width:0}
.statusPickBtn{width:46px;min-width:46px;padding:0;border:1px solid var(--bd);border-radius:9px;background:var(--sec);color:var(--tx);font-size:18px;font-weight:900}
.statusPanel{display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:40;max-height:330px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:7px;box-shadow:0 10px 28px rgba(20,34,56,.18)}
.statusPick.open .statusPanel{display:block}
.statusOption{display:block;width:100%;text-align:left;margin:0 0 5px;padding:10px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--st);color:var(--tx);font-size:13px;line-height:1.35;font-family:inherit;font-weight:600}
.statusOption:last-child{margin-bottom:0}
.statusOption:active{background:#e6eef9}

.photo{width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-top:8px}.phbox{border:2px dashed var(--bd);border-radius:12px;aspect-ratio:216/262;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mut);font-size:12px;text-align:center;background:var(--st)}.phbox img{width:100%;height:100%;object-fit:cover}.sig{height:50px;margin-top:6px;background:#fff;border:1px solid var(--bd)}.signGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.signBox{border:1px solid var(--bd);border-radius:12px;padding:8px;background:var(--st)}.signBox b{display:block;font-size:12px;margin-bottom:6px}.signCanvas{display:block;width:100%;height:105px;background:#fff;border:1px dashed #9aa9bb;border-radius:9px;touch-action:none;cursor:crosshair}.signActions{display:flex;gap:6px;margin-top:6px}.signActions button{flex:1;padding:7px 8px;font-size:12px}.signHint{font-size:11px;color:var(--mut);margin-top:6px}.sigGalleryBox{height:105px;background:#fff;border:1px dashed #9aa9bb;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mut);font-size:12px;text-align:center}.sigPreview{max-width:100%;max-height:100%;object-fit:contain}.sigPick{display:flex!important;align-items:center;justify-content:center;cursor:pointer}.sigPick input{display:none}
.sigSelectWrap{position:relative;margin-top:6px}.sigDropBtn{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:#fff;font-weight:700;text-align:left;cursor:pointer}.sigDropMenu{display:none;position:absolute;z-index:50;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.18);padding:6px;max-height:260px;overflow:auto}.sigDropMenu.open{display:block}.sigOption{display:flex;align-items:center;gap:8px;width:100%;border:1px solid #dbe3ee;background:#f7f9fc;border-radius:8px;padding:6px;margin:4px 0;cursor:pointer;text-align:left}.sigOption img{width:90px;height:48px;object-fit:contain;background:#fff;border-radius:5px;border:1px solid #e1e6ee}.sigOption span{font-weight:700;font-size:12px}.sigOption.selected{outline:2px solid #16a34a}.sigGalleryBtn{margin-top:6px}.sigSelectedLabel{font-size:11px;color:var(--mut);margin-top:4px}@media(max-width:600px){.signGrid{grid-template-columns:1fr}}

.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{border-radius:0;background:transparent;color:var(--mut);padding:8px 2px;font-size:11px}.nav b{display:block;font-size:18px}.nav .on{color:var(--pri)}
.toast{display:none;position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#142238;color:#fff;padding:11px 15px;border-radius:10px;z-index:50;max-width:90%;text-align:center;font-size:14px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
/* ---------- PDF sheet ---------- */
#pdfWrap{position:absolute;left:-10000px;top:0}
#pdfRoot{width:198mm;max-width:198mm;box-sizing:border-box;overflow:hidden;padding:0 8px;background:#fff;color:#000;font-family:'Noto Sans Devanagari','Nirmala UI',Mangal,Arial,sans-serif;font-size:13px}
#pdfRoot table{width:100%;max-width:100%;border-collapse:collapse;table-layout:fixed;margin-top:-1px}
#pdfRoot td{border:1px solid #000;padding:2px 5px;vertical-align:middle;line-height:1.2;height:24px;word-break:break-word}
#pdfRoot .b{font-weight:700}#pdfRoot .v{font-weight:600}
#pdfRoot .box{border:2px solid #000;display:flex;align-items:center;height:68px;background:#f2f2f2}
#pdfRoot .ttl{flex:1;text-align:center;font-size:27px;font-weight:600;font-family:Arial,sans-serif}
#pdfRoot .brk{page-break-before:always}
.nav button:nth-child(3).on{background:#16a34a!important;color:#fff!important}

<header><h1>📝 TFR Pro</h1><small>Technical Feasibility Report • Excel/CSV → PDF</small></header>
<main>
<section id="home" class="screen on">
<div class="kpis"><div class="kpi"><b id="kp">0</b><span>Pending</span></div><div class="kpi"><b id="kd">0</b><span>Done</span></div><div class="kpi"><b id="kc">-</b><span>Draft</span></div></div>
<div class="card"><h3>Applicant List Upload</h3><div style="font-size:13px;color:var(--mut)">CSV, XLS ya XLSX. Done wali applications dobara list me nahi aayengi.</div>

<button class="dng full" style="margin-top:10px" onclick="two(this,clearPend)">Pending list delete</button></div>
<div id="draftBox"></div>
</section>

<section id="pending" class="screen"><h2>Pending Applications</h2><div id="pendingSearchBox"></div><div id="plist"></div></section>

<section id="done" class="screen"><h2>TFR Done List</h2><div id="doneSearchBox"></div><div id="dlist"></div></section>

<section id="form" class="screen"><div id="formBox"></div></section>

<section id="settings" class="screen"><h2>Settings</h2><div id="setBox"></div></section>
</main>
<div class="bar" id="bar"><button onclick="goBack()">← List</button><button class="grn" onclick="saveDone(true)">💾 Save</button><button class="pri" onclick="makePDF()">⇩ PDF</button></div>

if(n.includes('TEMP')||n.includes('अस्थायी')||n.includes('अस्थाई'))return 'LMV-9';if(n.includes('COMMERC')||n.includes('वाणिज्य'))return 'LMV-2';
if(n.includes('DOMES')||n.includes('घरेलू')||n.includes('घरेलु'))return 'LMV-1';const x=raw.match(/LMV\s*-?\s*(\d+)/i);return x?'LMV-'+x[1]:raw}
function splitCSV(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'&&l[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else if(ch==='"')q=true;else if(ch===','){o.push(c);c=''}else c+=ch}o.push(c);return o}
function parseCSV(t){const L=String(t).replace(/^\uFEFF/,'').split(/\r?\n/),h=splitCSV(L[0]).map(x=>x.trim()),rows=[];for(let i=1;i<L.length;i++){if(!L[i].trim())continue;const v=splitCSV(L[i]),o={};h.forEach((k,j)=>o[k]=(v[j]||'').trim());rows.push(o)}setRows(rows)}
function parseSheetDate(v){
 const x=String(v??'').trim(); if(!x)return '';
 if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(x)){const [y,m,d]=x.split('-').map(Number);return `${y.toString().padStart(4,'0')}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
 let m=x.match(/^(\d{1,2})[\/._-](\d{1,2})[\/._-](\d{4})$/);if(m){const d=+m[1],mo=+m[2],y=+m[3];if(mo<=12&&d<=31)return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
 m=x.match(/^(\d{1,2})[\/._-](\d{1,2})[\/._-](\d{2})$/);if(m){const d=+m[1],mo=+m[2],y=2000+(+m[3]);if(mo<=12&&d<=31)return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
 if(/^\d+(?:\.\d+)?$/.test(x)){const n=Number(x);if(n>20000&&n<70000){const dt=new Date(Date.UTC(1899,11,30)+n*86400000);return dt.toISOString().slice(0,10)}}
 const dt=new Date(x);return isNaN(dt)?'':dt.toISOString().slice(0,10)
}
function dateFromFileName(name){
 const x=String(name||'').replace(/\.(xlsx?|xlsm|csv)$/i,'');
 // Handles names such as: CONNECTIONS WITHIN TIME DT 07.10.2026 (1)
 let m=x.match(/(?:\bDT\b|DATE|दिनांक|DATE\s*DT)?\s*(\d{1,2})[._\/-](\d{1,2})[._\/-](\d{4})/i);
 if(m)return parseSheetDate(`${m[1]}.${m[2]}.${m[3]}`);
 m=x.match(/(\d{4})[._\/-](\d{1,2})[._\/-](\d{1,2})/);
 if(m)return parseSheetDate(`${m[1]}-${m[2]}-${m[3]}`);
 return ''
}
function prettyDate(v){

 const [y,m,d]=p.split('-'); return `${d}-${m}-${y}`;
}
function dayDiff(a,b){const x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return Math.floor((y-x)/86400000)}

 const pd=parseSheetDate(a.pendingBaseDate||a.pendingDate||S.pendingBatchDate);

 if(Number.isFinite(base))return base-elapsed;
 return pd?elapsed:null;
}

async function shrink(f,max,type,q){return new Promise(res=>{const fr=new FileReader();fr.onload=e=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,q))};im.src=e.target.result};fr.readAsDataURL(f)})}

function exifGPS(buf){try{const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;let o=2;while(o<v.byteLength-4){const m=v.getUint16(o),len=v.getUint16(o+2);if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return tiffGPS(v,o+10);if((m&0xFF00)!==0xFF00||m===0xFFDA)break;o+=2+len}}catch(e){}return null}
function tiffGPS(v,t){const le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le),ifd=off=>{const n=u16(t+off),r={};for(let i=0;i<n;i++){const e=t+off+2+i*12;r[u16(e)]={v:e+8}}return r};
const i0=ifd(u32(t+4));if(!i0[0x8825])return null;const g=ifd(u32(i0[0x8825].v));
if(!g[2]||!g[4])return null;const rt=e=>{const p=t+u32(e.v);return[0,1,2].map(i=>u32(p+i*8)/u32(p+i*8+4))},ch=e=>String.fromCharCode(v.getUint8(e.v)),d=a=>a[0]+a[1]/60+a[2]/3600;
let la=d(rt(g[2])),lo=d(rt(g[4]));if(g[1]&&ch(g[1])==='S')la=-la;if(g[3]&&ch(g[3])==='W')lo=-lo;return isFinite(la)&&isFinite(lo)&&(la||lo)?{lat:la,lng:lo}:null}
function findLL(t){
 const x=String(t||'').replace(/[°º]/g,'°').replace(/[;,]/g,' ');
 // First prefer explicitly labelled Latitude/Longitude values.
 let m=x.match(/(?:lat(?:itude)?|latitude)\s*[:=\-]?\s*(\d{1,2}(?:\.\d+)?)/i);
 let n=x.match(/(?:lon(?:gitude)?|longitude|lng)\s*[:=\-]?\s*(7\d(?:\.\d+)?|8\d(?:\.\d+)?|9\d(?:\.\d+)?)/i);
 if(m&&n){let la=Number(m[1]),lo=Number(n[1]);if(la>=6&&la<=38&&lo>=68&&lo<=98)return[la.toFixed(6),lo.toFixed(6)]}
 // Common GPS-map formats: "28.6, 77.2", "Lat 28.6 Long 77.2", etc.
 const nums=(x.match(/\d{1,3}(?:\.\d{3,10})/g)||[]).map(Number);
 for(let i=0;i<nums.length;i++)for(let j=0;j<nums.length;j++)if(i!==j&&nums[i]>=6&&nums[i]<=38&&nums[j]>=68&&nums[j]<=98)return[nums[i].toFixed(6),nums[j].toFixed(6)];
 // DMS fallback: 28°37'xx"N 77°xx'xx"E
 const d=/(\d{1,2})[°\s]+(\d{1,2})['’\s]+(\d{1,2}(?:\.\d+)?)["”]?\s*([NS])/ig;
 const e=/(\d{1,3})[°\s]+(\d{1,2})['’\s]+(\d{1,2}(?:\.\d+)?)["”]?\s*([EW])/ig;
 const a=d.exec(x),b=e.exec(x);
 if(a&&b){let la=+a[1]+(+a[2]/60)+(+a[3]/3600),lo=+b[1]+(+b[2]/60)+(+b[3]/3600);if(a[4].toUpperCase()==='S')la=-la;if(b[4].toUpperCase()==='W')lo=-lo;if(Math.abs(la)>=6&&Math.abs(la)<=38&&Math.abs(lo)>=68&&Math.abs(lo)<=98)return[la.toFixed(6),lo.toFixed(6)]}
 return null;
}
async function pickPhoto(f){

 R.photo=await shrink(f,900,'image/jpeg',.72);
 try{localStorage.setItem(PK,JSON.stringify({no:R.appNo,d:R.photo}))}catch(e){}

 // OCR source: use the complete image, not only the bottom 40%.
 OCRC=await new Promise(res=>{
   const fr=new FileReader();
   fr.onload=e=>{
     const im=new Image();
     im.onload=()=>{
       const s=Math.min(1,3000/Math.max(im.width,im.height));
       const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
       const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,c.width,c.height);
       // Slight contrast/greyscale makes small GPS text much easier for OCR.
       const id=x.getImageData(0,0,c.width,c.height),d=id.data;
       for(let i=0;i<d.length;i+=4){let v=(d[i]*.299+d[i+1]*.587+d[i+2]*.114);v=v<150?v*.82:Math.min(255,v*1.12);d[i]=d[i+1]=d[i+2]=v}

   };fr.readAsDataURL(f)
 });

async function makePDF(){if(!window.html2pdf){toast('PDF library load nahi hui - internet check karein');return}if(missing())return;toast('PDF ban rahi hai...');
try{const ph=R.photo?await crop(R.photo,216,262):'',root=$('pdfRoot');root.innerHTML=pdfHTML(ph);root.style.fontSize='13px';await new Promise(r=>setTimeout(r,200));const pim=$('phimg');if(pim&&pim.decode)await pim.decode().catch(()=>{});
let fs=13;const pg=$('pg1');
/* Fit the complete first-page TFR into one A4 page.  The usable height is
   derived from the PDF margins, so longer remarks/expanded boxes trigger
   automatic font reduction instead of spilling onto page 2. */
const pagePx=Math.floor((297-10)*96/25.4); // A4 height minus 5mm top+bottom
while(pg.offsetHeight>pagePx&&fs>8){fs-=.25;root.style.fontSize=fs+'px'}
/* One final proportional fit handles unusually long remarks without changing
   the layout/field widths. */
if(pg.offsetHeight>pagePx){const ratio=pagePx/pg.offsetHeight;const fitted=Math.max(7.5,fs*ratio);root.style.fontSize=fitted.toFixed(2)+'px'}
const name=[R.pendingAt,R.appNo,R.name].join('-').replace(/\s+/g,' ').replace(/[\\/:*?"<>|]/g,'')+'.pdf';
const pdfOpt={margin:[5,6,5,6],filename:name,image:{type:'jpeg',quality:.92},html2canvas:{scale:2,scrollY:0,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},pagebreak:{mode:['css'],before:'.brk'}};
/* A page scrollbar (15px) makes the capture box shift sideways and clips the right border: hide it while the PDF is made and pin the box to left:0 */
const oldOv=document.documentElement.style.overflow;document.documentElement.style.overflow='hidden';
try{await html2pdf().set(pdfOpt).from(root).toContainer().get('container',c=>{c.style.margin='0';c.style.left='0';c.style.right='auto'}).toCanvas().toPdf().save()}
catch(e1){console.warn('fallback',e1);await html2pdf().set(pdfOpt).from(root).save()}
finally{document.documentElement.style.overflow=oldOv}
saveDone(false);toast('✅ PDF download ho gayi aur Done list me save hui')}catch(e){console.error(e);toast('❌ PDF error: '+(e.message||e))}}
